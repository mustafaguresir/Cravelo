# Cravelo / Yemek Kurye Sistemi — Production Nginx Server Block
# Tested on Ubuntu 24.04 LTS + PHP-FPM 8.2

server {
    listen 80;
    server_name siparis.mustafaguresir.com www.siparis.mustafaguresir.com;

    # Security: Root must be /public so storage, src and views are strictly private
    root /var/www/cravelo/public;
    index index.php index.html;

    charset utf-8;

    # Static assets and front controller fallback
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Strict isolation: Deny direct HTTP access to internal directories
    location ~* /(storage|src|views)/ {
        deny all;
        return 404;
    }

    # Deny access to hidden files (.git, .env, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static file caching
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 60s;
    }

    # Logging
    access_log /var/log/nginx/cravelo_access.log;
    error_log /var/log/nginx/cravelo_error.log;
}
