<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Güvenli Çıkış Yapılıyor — Cravelo</title>
    <meta http-equiv="refresh" content="1; url=login.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23FF6B35'/%3E%3Cstop offset='100%25' stop-color='%23FA4A0C'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M16 28c0-8 7.2-13 16-13s16 5 16 13H16zm-2 5h36a3 3 0 0 1 0 6H14a3 3 0 0 1 0-6zm3 9h30v3c0 3.3-2.7 6-6 6H23c-3.3 0-6-2.7-6-6v-3z' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        (function () {
            try {
                var savedTheme = localStorage.getItem('cravelo-theme') || localStorage.getItem('gustogo-theme') || 'dark';
                document.documentElement.setAttribute('data-theme', savedTheme);
            } catch (e) {}
        })();
    </script>
    <style>
        :root,
        :root[data-theme="dark"] {
            --bg-page: #080C16;
            --card-bg: rgba(15, 22, 38, 0.9);
            --card-border: rgba(255, 255, 255, 0.09);
            --card-shadow: 0 32px 72px -16px rgba(0, 0, 0, 0.78);
            --text-title: #F8FAFC;
            --text-sub: #94A3B8;
            --primary: #FF6B35;
            --surface-2: rgba(255, 255, 255, 0.05);
        }
        :root[data-theme="light"] {
            --bg-page: #F8FAFC;
            --card-bg: rgba(255, 255, 255, 0.96);
            --card-border: #E2E8F0;
            --card-shadow: 0 28px 64px -16px rgba(15, 23, 42, 0.12);
            --text-title: #0F172A;
            --text-sub: #475569;
            --primary: #FA4A0C;
            --surface-2: #F1F5F9;
        }
        * {
            box-sizing: border-box;
        }
        body {
            background-color: var(--bg-page);
            background-image:
                radial-gradient(ellipse 60% 45% at 50% 25%, rgba(255, 107, 53, 0.14) 0%, transparent 65%),
                radial-gradient(ellipse 45% 40% at 85% 85%, rgba(56, 189, 248, 0.07) 0%, transparent 60%);
            color: var(--text-title);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .logout-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 44px 40px;
            text-align: center;
            max-width: 440px;
            width: 100%;
        }
        .brand-icon {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: linear-gradient(135deg, #FF6B35, #FA4A0C);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #FFFFFF;
            margin-bottom: 18px;
            box-shadow: 0 10px 28px rgba(255, 107, 53, 0.42);
            animation: pulseGlow 2s infinite ease-in-out;
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 28px rgba(255, 107, 53, 0.42); }
            50% { transform: scale(1.04); box-shadow: 0 14px 34px rgba(255, 107, 53, 0.6); }
        }
        .logout-brand {
            color: var(--text-title);
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.6px;
            margin: 0 0 8px;
        }
        .logout-brand span {
            color: var(--primary);
        }
        .logout-desc {
            color: var(--text-sub);
            font-size: 14px;
            margin: 0 0 22px;
            line-height: 1.6;
        }
        .logout-progress {
            width: 100%;
            height: 5px;
            border-radius: 9999px;
            background: var(--surface-2);
            overflow: hidden;
            margin-bottom: 24px;
        }
        .logout-progress-bar {
            height: 100%;
            width: 65%;
            border-radius: 9999px;
            background: linear-gradient(90deg, #FF6B35, #FA4A0C);
            animation: slideBar 0.9s ease-in-out infinite;
        }
        @keyframes slideBar {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(180%); }
        }
        .logout-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 22px;
            border-radius: 13px;
            background: var(--surface-2);
            border: 1px solid var(--card-border);
            color: var(--text-title);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 700;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .logout-cta:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="logout-card">
        <div class="brand-icon">
            <i class="fa-solid fa-burger"></i>
        </div>
        <h1 class="logout-brand">Crave<span>lo</span></h1>
        <p class="logout-desc">
            Oturumunuz güvenli biçimde kapatılıyor, giriş ekranına yönlendiriliyorsunuz…
        </p>
        <div class="logout-progress" role="progressbar" aria-label="Çıkış yapılıyor">
            <div class="logout-progress-bar"></div>
        </div>
        <a href="login.html" class="logout-cta">
            <i class="fa-solid fa-right-to-bracket"></i> Giriş Ekranına Git
        </a>
    </div>
    <script>
        try {
            localStorage.removeItem('cravelo_state_v2');
            localStorage.removeItem('cravelo_session');
            localStorage.removeItem('kuryo_state_v2');
            localStorage.removeItem('kuryo_session');
            localStorage.removeItem('gustogo_state_v2');
            localStorage.removeItem('gustogo_session');
            localStorage.removeItem('tgo_state_v2');
            localStorage.removeItem('tgo_session');
            sessionStorage.clear();
        } catch (e) {}
        fetch('api.php?action=logout', { method: 'POST' }).catch(() => {});
        window.location.href = 'login.html';
    </script>
</body>
</html>
